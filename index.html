<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F2">
<meta name="color-scheme" content="light">
<title>Arroz en Caja</title>
<meta name="description" content="Arroces y fideuás cocinados por encargo, con hora de entrega marcada. Envase 100% reciclable. Ávila, Colmenar Viejo y Tres Cantos.">
<link rel="preload" as="image" href="img/menu-caja.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#carta">Saltar a la carta</a>
<div id="notice" class="notice" role="status"></div>

<header class="bar" id="bar">
  <div class="bar-in">
    <a class="logo" href="#inicio" id="logo" aria-label="Arroz en Caja, inicio"></a>
    <nav class="nav" aria-label="Principal">
      <a href="#carta">Carta</a>
      <a href="#nosotros">Nosotros</a>
      <a href="#pedir">Cómo pedir</a>
      <a href="#locales">Locales</a>
      <a href="#franquicia">Franquicia</a>
    </nav>
    <div class="bar-actions">
      <button class="store-chip empty" id="storeChip" type="button" aria-haspopup="dialog" aria-label="Elegir local"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg><b id="storeChipName">Elige local</b></button>
      <a class="btn sm" href="#carta" id="barCta">Pedir</a>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú"><span><i></i><i></i></span></button>
    </div>
  </div>
</header>

<nav class="menu" id="menu" aria-label="Menú móvil">
  <a href="#carta" style="--i:0">Carta</a>
  <a href="#nosotros" style="--i:1">Nosotros</a>
  <a href="#pedir" style="--i:2">Cómo pedir</a>
  <a href="#locales" style="--i:3">Locales</a>
  <a href="#franquicia" style="--i:4">Franquicia</a>
  <a class="btn" href="#carta" style="--i:5">Haz tu pedido</a>
</nav>

<main id="app"><p class="fatal">Cargando la carta…</p></main>

<!-- cart bar + assistant button -->
<button class="cartbar" id="cartbar" aria-haspopup="dialog">
  <span><span class="n" id="cartN">0</span>Tu pedido</span><span id="cartTotal">0,00 €</span>
</button>
<button class="fab" id="fab" aria-haspopup="dialog" aria-label="Preguntar al asistente">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M9 11h6M9 14h3"/></svg>
  <span>Pregúntanos</span>
</button>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle" aria-hidden="true">
  <span class="grab" aria-hidden="true"></span>
  <div class="sheet-h"><h2 id="cartTitle">Tu pedido</h2><button class="x" data-close aria-label="Cerrar">×</button></div>
  <div class="sheet-b" id="cartBody"></div>
  <div class="sheet-f" id="cartFoot"></div>
</section>

<section class="sheet" id="chatSheet" role="dialog" aria-modal="true" aria-labelledby="chatTitle" aria-hidden="true">
  <span class="grab" aria-hidden="true"></span>
  <div class="sheet-h"><h2 id="chatTitle">Pregúntanos</h2><button class="x" data-close aria-label="Cerrar">×</button></div>
  <div class="sheet-b" id="chatBody"><div class="chat" id="chatLog"></div><div class="sugg" id="chatSugg"></div></div>
  <form class="ask" id="askForm" autocomplete="off">
    <label class="sr" for="askInput">Tu pregunta</label>
    <input id="askInput" type="text" enterkeyhint="send" placeholder="Escribe tu pregunta" maxlength="300">
    <button class="btn" type="submit">Enviar</button>
  </form>
</section>

<section class="sheet" id="storeSheet" role="dialog" aria-modal="true" aria-labelledby="storeTitle" aria-hidden="true">
  <span class="grab" aria-hidden="true"></span>
  <div class="sheet-h"><h2 id="storeTitle">¿Dónde quieres pedir?</h2><button class="x" data-close aria-label="Cerrar">×</button></div>
  <div class="sheet-b" id="storeBody"></div>
</section>

<section class="sheet wide fullm" id="coSheet" role="dialog" aria-modal="true" aria-labelledby="coTitle" aria-hidden="true">
  <span class="grab" aria-hidden="true"></span>
  <div class="sheet-h"><h2 id="coTitle">Finalizar compra</h2><button class="x" data-close aria-label="Cerrar">×</button></div>
  <div class="sheet-b" id="coBody"></div>
  <div class="co-foot" id="coFoot"></div>
</section>

<div class="toast" id="toast" role="status"></div>

<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
